<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form action="" id="form" novalidate>
        <p>
            <label for="input-email">
                <span>*Email: </span>
                <input type="email" id="input-email" required placeholder="example@example.com">
                <span class="email error" aria-live="polite"></span>
            </label>
        </p>
        <p>
            <label for="input-country">
                <span>*Country: </span>
                <input type="text" id="input-country" required maxlength="100">
                <span class="error" aria-live="polite"></span>
            </label>
        </p>
        <p>
            <label for="input-postal-code">
                <span>*Postal Code: </span>
                <input type="text" inputmode="numeric" 
                maxlength="10" id="input-postal-code" placeholder="12345" required>
                <span class="error" aria-live="polite"></span>
            </label>
        </p>
        <p>
            <label for="input-pass">
                <span>*Password: </span>
                <input type="text" id="input-pass" required minlength="8">
                <span class="pass error" aria-live="polite"></span>
            </label>
        </p>

        <p>
            <label for="input-pass-confirm">
                <span>*Confirm Password: </span>
                <input type="text" id="input-pass-confirm" required minlength="8">
                <span class="pass-confirm error" aria-live="polite"></span>
            </label>
        </p>

        <button>Submit</button>
        <span class="submit-btn-span error"></span>
    </form>
    
</body>
</html>

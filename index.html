<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form action="" id="form" novalidate>
        <p>
            <label for="input-email">
                <span>*Email: </span>
                <input type="email" id="input-email" required>
                <span class="error-email" aria-live="polite"></span>
            </label>
        </p>
        <p>
            <label for="input-country">
                <span>*Country: </span>
                <input type="text" id="input-country" required>
                <span class="error-country"></span>
            </label>
        </p>
        <p>
            <label for="input-postal-code">
                <span>*Postal Code: </span>
                <input type="number" id="input-postal-code" required>
                <span class="error-postal-code"></span>
            </label>
        </p>
        <p>
            <label for="input-pass">
                <span>*Password: </span>
                <input type="text" id="input-password" required>
                <span class="error-password"></span>
            </label>
        </p>

        <p>
            <label for="input-pass-confirm">
                <span>*Confirm Password: </span>
                <input type="text" id="input-pass-confirm" required>
                <span class="error-pass-confirm"></span>
            </label>
        </p>

        <button>Submit</button>
    </form>
    
</body>
</html>
